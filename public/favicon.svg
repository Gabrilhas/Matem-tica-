<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="glyphGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#10b981" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Base rounded container -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4.5" />
  
  <!-- Subtle glass inner highlight -->
  <rect x="10" y="10" width="108" height="54" rx="24" fill="white" opacity="0.05" />

  <!-- Iconic Math Emblem: √ and ± -->
  <g fill="url(#glyphGrad)" filter="url(#glow)">
    <!-- Radical sign √ -->
    <path d="M 22,68 L 30,68 L 41,96 L 55,30 L 74,30 L 74,40 L 62,40 L 48,102 L 35,102 L 26,78 L 22,78 Z" />
    
    <!-- Bold 'x' under or beside the radical -->
    <path d="M 80,48 L 88,36 L 98,36 L 89,49 L 99,64 L 89,64 L 83,55 L 77,64 L 67,64 L 78,49 L 69,36 L 79,36 Z" />

    <!-- Plus / Minus (±) symbol -->
    <!-- Plus horizontal -->
    <rect x="70" y="80" width="28" height="6" rx="3" fill="#6ee7b7" />
    <!-- Plus vertical -->
    <rect x="81" y="69" width="6" height="28" rx="3" fill="#6ee7b7" />
    <!-- Minus bar below -->
    <rect x="70" y="102" width="28" height="6" rx="3" fill="#34d399" />
  </g>
</svg>
